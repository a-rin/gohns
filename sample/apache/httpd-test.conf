# A test instance of Apache for sample/, started by check.sh: run by an
# ordinary user, not root, and only on 127.0.0.1:8080.
# For FreeBSD with the packages apache24 and ap24-mod_fcgid. The environment
# variable ROOT names a directory for the document root, the logs and the sockets.
ServerRoot "/usr/local"
Listen 127.0.0.1:8080
ServerName localhost:8080
PidFile "${ROOT}/run/httpd.pid"
Mutex file:${ROOT}/run default
ErrorLog "${ROOT}/logs/error.log"
LogLevel warn
LogFormat "%h %t \"%r\" %>s %b" common
CustomLog "${ROOT}/logs/access.log" common
# the kernel module accf_http is not loaded
AcceptFilter http none

LoadModule mpm_event_module libexec/apache24/mod_mpm_event.so
LoadModule unixd_module libexec/apache24/mod_unixd.so
LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule log_config_module libexec/apache24/mod_log_config.so
LoadModule cgid_module libexec/apache24/mod_cgid.so
LoadModule fcgid_module libexec/apache24/mod_fcgid.so

TypesConfig etc/apache24/mime.types
ScriptSock ${ROOT}/run/cgisock

# the same handlers as the production server
<IfModule mod_fcgid.c>
  FcgidIPCDir ${ROOT}/run/fcgid
  FcgidProcessTableFile ${ROOT}/run/fcgid_shm
  AddHandler fcgid-script .fcgi
</IfModule>
AddHandler cgi-script .cgi

DocumentRoot "${ROOT}/htdocs"
<Directory />
  AllowOverride None
  Require all denied
</Directory>
# AllowOverride All, because sample/.htaccess has to take effect
<Directory "${ROOT}/htdocs">
  AllowOverride All
  Options +ExecCGI
  Require all granted
</Directory>
